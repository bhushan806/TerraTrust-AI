services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: fin03
      POSTGRES_USER: fin03
      POSTGRES_PASSWORD: fin03_local_only
    ports: ["5432:5432"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fin03 -d fin03"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes: ["pgdata:/var/lib/postgresql/data"]
  api:
    build: ./apps/api
    env_file: .env
    ports: ["8000:8000"]
    depends_on:
      db: {condition: service_healthy}
  web:
    build: ./apps/web
    ports: ["5173:5173"]
    depends_on: [api]
  worker:
    build: ./apps/worker
    env_file: .env
    depends_on:
      db: {condition: service_healthy}
volumes:
  pgdata: {}
